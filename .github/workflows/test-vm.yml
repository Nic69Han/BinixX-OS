---
name: Test VM

# End-to-end test of the image in a KVM virtual machine (tests/vm/run-vm-test.sh):
# unattended install from the ISO, Secure Boot boot, system checks, then an update from a
# local registry followed by a rollback.
#
# Release channels: build.yml publishes every build as `testing`. This workflow pins the
# digest of `testing` when it starts, tests exactly that image and, only if every check
# passes, promotes that same digest to `stable` and `latest`. Installed machines follow
# `stable` (see disk_config/iso.toml), so they never receive an untested image.
#
# Pull requests: run it by hand on the PR branch with `build` checked. The image is then
# built from that branch and tested, and never promoted.
on:
  workflow_run:
    workflows: ["Build container image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image:
        description: "Image to test (default: ghcr.io/<owner>/binixx:testing)"
        required: false
        type: string
      build:
        description: "Build the image from the selected branch instead (to test a pull request; never promoted)"
        required: false
        default: false
        type: boolean
      variant:
        description: "Image variant to test: main (binixx) or nvidia (binixx-nvidia)"
        required: false
        default: main
        type: choice
        options: [main, nvidia]
      promote:
        description: "Promote the tested image to stable and latest if the test passes"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write  # promotion: new tags on the existing image

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.variant }}
  cancel-in-progress: true

jobs:
  vm-test:
    name: Install, boot, update and rollback in a VM (${{ matrix.image }})
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    # BinixX OS: after a build of main, both images (binixx and binixx-nvidia) are tested and promoted on their
    # own: a failure of one never blocks the other. By hand, one image: the `variant` input.
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(github.event_name == 'workflow_run' && '["binixx","binixx-nvidia"]' || (inputs.variant == 'nvidia' && '["binixx-nvidia"]' || '["binixx"]')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU, OVMF and skopeo
        run: |
          sudo apt-get update
          # tesseract-ocr : lit les quelques lignes de texte que le test VM voit à l'écran pendant le démarrage (docs/demarrage.md)
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf xorriso openssh-client skopeo tesseract-ocr tesseract-ocr-eng

      - name: Let osbuild use bubblewrap
        run: |
          # Ubuntu 25.04+ confines /usr/bin/bwrap with AppArmor: every program it starts loses
          # all capabilities, even as root in a privileged container. osbuild (inside
          # bootc-image-builder) runs each build stage through bwrap, so the ISO build fails
          # with "mount: /run/osbuild/tree/dev: permission denied". The runner is discarded
          # after the job, so the profile is simply unloaded.
          if [[ -f /etc/apparmor.d/bwrap-userns-restrict ]]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi

      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          # podman and skopeo share the root credentials file
          echo "${REGISTRY_TOKEN}" | sudo podman login ghcr.io --username "${ACTOR}" --password-stdin

      # quay.io drops connections to its CDN on some runners (unexpected EOF, for hours on 2026-10-02):
      # fetch bootc-image-builder first, with resume, so that a failure shows up in a minute and not
      # after the 10 minutes of image build.
      - name: Fetch bootc-image-builder
        run: sudo tests/vm/fetch-bib.sh

      - name: Pin the image digest
        if: ${{ !inputs.build }}
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          image="${INPUT_IMAGE:-ghcr.io/${OWNER,,}/${IMAGE_NAME}:testing}"
          if [[ "${image}" == *@* ]]; then repo="${image%@*}"; else repo="${image%:*}"; fi
          digest="$(sudo skopeo inspect --format '{{.Digest}}' "docker://${image}")"
          echo "Testing ${repo}@${digest} (from ${image})"
          {
            echo "TEST_REPO=${repo}"
            echo "TEST_DIGEST=${digest}"
            echo "TEST_IMAGE=${repo}@${digest}"
          } >> "${GITHUB_ENV}"

      # Same Containerfile as build.yml, built in root's storage where run-vm-test.sh reads it
      - name: Build the image from this branch
        if: ${{ inputs.build }}
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          build_args=()
          if [[ "${IMAGE_NAME}" == binixx-nvidia ]]; then
            build_args=(--build-arg BASE_IMAGE=ghcr.io/ublue-os/kinoite-nvidia:44 --build-arg BINIXX_VARIANT=nvidia)
          fi
          sudo podman build "${build_args[@]}" --pull=newer --tag localhost/binixx:vm-test --file Containerfile .
          echo "TEST_REPO=ghcr.io/${OWNER,,}/${IMAGE_NAME}" >> "${GITHUB_ENV}"
          echo "TEST_IMAGE=localhost/binixx:vm-test" >> "${GITHUB_ENV}"

      - name: Run VM test
        run: |
          sudo tests/vm/run-vm-test.sh \
            --image "${TEST_IMAGE}" \
            --switch-ref "${TEST_REPO}:stable"

      - name: Promote to stable
        if: success() && !inputs.build && (github.event_name == 'workflow_run' || inputs.promote)
        run: |
          for tag in stable latest; do
            sudo skopeo copy --all --preserve-digests \
              "docker://${TEST_REPO}@${TEST_DIGEST}" "docker://${TEST_REPO}:${tag}"
          done
          {
            echo "### Image promoted"
            echo ""
            echo "\`${TEST_REPO}@${TEST_DIGEST}\` passed the VM test and is now \`stable\` and \`latest\`."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vm-test-logs-${{ matrix.image }}
          path: tests/vm/_work/logs/
          if-no-files-found: warn
          retention-days: 14
