---
name: Build installer ISO

# Builds the BinixX OS installer ISO from the image published on GHCR by build.yml.
# Run it by hand from the Actions tab once build.yml has published an image
# (the ISO embeds the published image, not the one from a pull request).
on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean

env:
  IMAGE_NAME: binixx # image published by build.yml (IMAGE_NAME in binixx.env), whatever the repository is called
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "stable"  # the ISO embeds the last image validated by the VM test
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installer ISO
    # The base image (kinoite-main) is only published for x86_64
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Let osbuild use bubblewrap
        run: |
          # Ubuntu 25.04+ confines /usr/bin/bwrap with AppArmor: every program it starts loses
          # all capabilities, even as root in a privileged container. osbuild (inside
          # bootc-image-builder) runs each build stage through bwrap, so the ISO build fails
          # with "mount: /run/osbuild/tree/dev: permission denied". The runner is discarded
          # after the job, so the profile is simply unloaded.
          if [[ -f /etc/apparmor.d/bwrap-userns-restrict ]]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi

      - name: Build ISO
        id: build
        uses: osbuild/bootc-image-builder-action@028e4d28330efe546229eb9cb52aee78174d2347 # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/iso.toml
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: anaconda-iso
          additional-args: --use-librepo=True

      # bootc-image-builder names the volume "Fedora-S-dvd-…" and builds the installer from Fedora
      # packages (Fedora logo), with no option for either: rename the volume "BinixX-OS-…" everywhere
      # the boot menus use it, and add images/product.img with the BinixX OS logo (see the script).
      - name: Brand the ISO
        env:
          OUTPUT_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso mtools cpio isomd5sum
          iso="$(find "${OUTPUT_DIR}" -name '*.iso' -print -quit)"
          disk_config/personnaliser-iso.sh "${iso}"

      - name: Upload ISO and checksum to job artifacts
        if: inputs.upload-to-s3 != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binixx-installer-iso
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      - name: Upload to S3
        if: inputs.upload-to-s3 == true
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}

      # Smoke test of the ISO that was just published: boot it in a VM like a real PC
      # (UEFI with Secure Boot, the ISO's own shim and GRUB), check that the graphical
      # installer starts with the language choice and the BinixX OS logo, then boot it again
      # in French; screenshots of both. Nothing is installed (tests/iso/).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf xorriso

      - name: Boot the ISO up to the installer
        env:
          OUTPUT_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          iso="$(find "${OUTPUT_DIR}" -name '*.iso' -print -quit)"
          tests/iso/boot-installer.sh "${iso}"

      - name: Upload installer screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-boot
          path: tests/iso/_work/logs/
          if-no-files-found: warn
          retention-days: 14
