# BinixX OS : mémoire vive avec une mémoire d'échange compressée en mémoire (zram), docs/memoire.md.
# Le zram est bien plus rapide qu'un disque : le noyau peut y ranger plus volontiers les pages peu utilisées au lieu de vider le cache
# des fichiers (vm.swappiness au-dessus de 100, Documentation/admin-guide/sysctl/vm.rst), et sans lire par paquets de 8 pages
# (vm.page-cluster=0, inutile hors d'un disque).
vm.swappiness = 150
vm.page-cluster = 0
# Pas de récupération supplémentaire après une fragmentation : moins de saccades quand la mémoire se remplit
vm.watermark_boost_factor = 0
