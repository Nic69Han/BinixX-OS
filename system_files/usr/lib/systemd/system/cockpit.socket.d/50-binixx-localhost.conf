# BinixX OS : le centre d'administration (Cockpit) n'écoute que sur le PC lui-même.
# Pour l'administrer depuis un autre poste, remplacer ces adresses par une surcharge dans
# /etc/systemd/system/cockpit.socket.d/ et ouvrir le service « cockpit » du pare-feu.
[Socket]
ListenStream=
ListenStream=127.0.0.1:9090
ListenStream=[::1]:9090
