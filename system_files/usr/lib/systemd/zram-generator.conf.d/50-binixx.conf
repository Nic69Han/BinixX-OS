# BinixX OS : mémoire d'échange compressée en mémoire vive (zram), docs/memoire.md.
# Aussi grande que la mémoire vive (8 Go au plus) : avec une compression de 2 à 3 pour 1, un PC de 4 Go se comporte comme s'il en
# avait 6 à 7 avant de ralentir. zstd compresse mieux que lz4, pour un peu plus de processeur.
[zram0]
zram-size = min(ram, 8192)
compression-algorithm = zstd
