# BinixX OS : mémoire d'échange compressée en mémoire vive (zram), docs/memoire.md.
# Fedora la crée déjà aussi grande que la mémoire vive (8 Go au plus), en lzo-rle. zstd compresse mieux (2 à 3 pour 1 au lieu
# d'environ 2) pour un peu plus de processeur : sur un PC de 4 Go, c'est plusieurs centaines de Mo de plus avant de ralentir.
[zram0]
compression-algorithm = zstd
