# BinixX OS : réglages GTK par défaut du système (docs/applications-unifiees.md). Chaque compte a les siens dans
# ~/.config/gtk-*/settings.ini, que kde-gtk-config réécrit à chaque ouverture de session d'après KDE ; ceux-ci valent pour ce que
# le compte ne précise pas, et avant la première session.
[Settings]
gtk-theme-name=Breeze
gtk-icon-theme-name=binixx-os
gtk-cursor-theme-name=binixx-curseurs
gtk-font-name=Inter 10
gtk-decoration-layout=icon:minimize,maximize,close
