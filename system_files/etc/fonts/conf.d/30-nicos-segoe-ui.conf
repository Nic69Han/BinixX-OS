<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  NicOS : Segoe UI, la police de l'interface de Windows (fréquente dans les documents et les
  pages web), est remplacée par Selawik, que Microsoft publie sous licence libre avec les mêmes
  largeurs de caractères. Même principe que 30-metric-aliases.conf pour Calibri et Carlito.
-->
<fontconfig>
  <alias binding="same">
    <family>Segoe UI</family>
    <accept><family>Selawik</family></accept>
  </alias>
  <alias binding="same">
    <family>Segoe UI Light</family>
    <accept><family>Selawik Light</family></accept>
  </alias>
  <alias binding="same">
    <family>Segoe UI Semilight</family>
    <accept><family>Selawik Semilight</family></accept>
  </alias>
  <alias binding="same">
    <family>Segoe UI Semibold</family>
    <accept><family>Selawik Semibold</family></accept>
  </alias>
</fontconfig>
