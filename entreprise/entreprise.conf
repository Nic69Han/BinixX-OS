# shellcheck shell=bash disable=SC2034
# Réglages de l'entreprise, lus par build.sh. Un seul fichier à modifier pour la plupart des besoins ;
# pour le reste, déposer des fichiers dans system_files/ (ils sont copiés tels quels à la racine).
# Exemple fictif : remplacer par les valeurs de l'entreprise.

# Nom affiché dans « À propos » et dans /etc/os-release (VARIANT). NicOS reste le nom du système.
NOM_ENTREPRISE="Exemple SARL"

# Logiciels supplémentaires (paquets Fedora, installés dans l'image, disponibles hors connexion)
PAQUETS=(
    htop
)

# Page d'accueil de Firefox ('' = ne pas imposer de page)
PAGE_ACCUEIL="https://intranet.exemple.fr"

# Serveur mandataire (proxy) de Firefox, « hôte:port » ('' = connexion directe)
PROXY=""

# Domaine Active Directory, uniquement pour mémoire dans /etc/nicos/entreprise.conf (support) ;
# la jonction se fait une fois par poste : docs/administration.md, ligne « Rejoindre le domaine »
DOMAINE_AD=""
