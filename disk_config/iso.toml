# ISO d'installation NicOS (Anaconda), générée par bootc-image-builder.
#
# L'installeur demande d'abord sa langue (écran « Bienvenue » : français, anglais…),
# qui règle aussi le clavier (AZERTY pour le français) et devient la langue du
# système installé ; puis le disque de destination, avec l'option « Chiffrer mes
# données » (recommandée). Le reste (Wi-Fi, fuseau horaire, compte utilisateur) est
# demandé au premier démarrage par l'assistant KDE « Plasma Setup », comme l'accueil
# de Windows. Activer ici le module Users ferait créer le compte deux fois.
#
# Nom du volume (« NicOS-44-x86_64 », nom de la clé USB) et logo NicOS de l'installeur :
# appliqués après coup par disk_config/personnaliser-iso.sh (bootc-image-builder n'a pas
# d'option pour cela).

[customizations.installer.kickstart]
contents = """
%post
# L'ISO installe l'image embarquée ; on pointe ensuite le système vers le canal « stable »
# du registre : les mises à jour ne viennent que d'images validées par le test VM.
bootc switch --mutate-in-place --transport registry ghcr.io/nic69han/nicos:stable
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Localization",
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime"
]
disable = [
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Subscription",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]
