# ISO d'installation BinixX OS (Anaconda), générée par bootc-image-builder.
#
# L'installeur demande d'abord sa langue (écran « Bienvenue » : français, anglais…),
# qui règle aussi le clavier (AZERTY pour le français), le fuseau horaire de départ
# et devient la langue du système installé ; puis le disque de destination, avec
# l'option « Chiffrer mes données » (recommandée). Le reste (Wi-Fi, compte
# utilisateur) est demandé au premier démarrage par l'assistant KDE « Plasma Setup »,
# comme l'accueil de Windows. Activer ici le module Users ferait créer le compte deux fois.
#
# Les modules Timezone et Network doivent rester actifs : Anaconda ne vérifie pas leur
# présence quand on valide la langue (« AttributeError: 'NoneType' object has no attribute
# 'SetTimezoneWithPriority' », installeur planté) ni à l'ouverture de l'écran « Date et
# heure » (qui interroge le réseau). tests/iso/test_iso_toml.py le garde, et
# tests/iso/boot-installer.sh clique sur « Continuer » pour le vérifier pour de bon.
#
# Nom du volume (« BinixX-OS-44-x86_64 », nom de la clé USB) et logo BinixX OS de l'installeur :
# appliqués après coup par disk_config/personnaliser-iso.sh (bootc-image-builder n'a pas
# d'option pour cela).

[customizations.installer.kickstart]
contents = """
%post
# L'ISO installe l'image embarquée ; on pointe ensuite le système vers le canal « stable »
# du registre : les mises à jour ne viennent que d'images validées par le test VM.
bootc switch --mutate-in-place --transport registry ghcr.io/nic69han/binixx:stable
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Localization",
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Timezone",
  "org.fedoraproject.Anaconda.Modules.Network"
]
disable = [
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Subscription"
]
